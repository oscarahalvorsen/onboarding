name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get diff
        id: diff
        run: |
          DIFF=$(git diff origin/${{ github.base_ref }}...HEAD)
          echo "diff<<EOF" >> $GITHUB_OUTPUT
          echo "$DIFF" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Call Foundry Agent
        id: review
        env:
          FOUNDRY_ENDPOINT: ${{ secrets.FOUNDRY_ENDPOINT }}
          FOUNDRY_API_KEY: ${{ secrets.FOUNDRY_API_KEY }}
          FOUNDRY_AGENT_ID: ${{ secrets.FOUNDRY_AGENT_ID }}
          PR_DIFF: ${{ steps.diff.outputs.diff }}
        run: |
          python3 - <<'EOF'
          import os, json, urllib.request, urllib.error, time

          endpoint = os.environ["FOUNDRY_ENDPOINT"].rstrip("/")
          api_key = os.environ["FOUNDRY_API_KEY"]
          agent_id = os.environ["FOUNDRY_AGENT_ID"]
          diff = os.environ["PR_DIFF"]

          headers = {
              "Content-Type": "application/json",
              "api-key": api_key
          }

          print(f"Endpoint: {endpoint}")
          print(f"Agent ID: {agent_id}")

          # Create thread
          url = f"{endpoint}/threads?api-version=2025-05-01"
          print(f"Creating thread at: {url}")
          req = urllib.request.Request(url, data=json.dumps({}).encode(), headers=headers)
          try:
              thread = json.loads(urllib.request.urlopen(req).read())
          except urllib.error.HTTPError as e:
              print(f"Create thread failed: {e.code} {e.read().decode()}")
              raise

          thread_id = thread["id"]
          print(f"Thread ID: {thread_id}")

          # Add message
          url = f"{endpoint}/threads/{thread_id}/messages?api-version=2025-05-01"
          req = urllib.request.Request(url, data=json.dumps({"role": "user", "content": f"Review this PR diff:\n\n{diff}"}).encode(), headers=headers)
          try:
              urllib.request.urlopen(req)
          except urllib.error.HTTPError as e:
              print(f"Add message failed: {e.code} {e.read().decode()}")
              raise

          # Run agent
          url = f"{endpoint}/threads/{thread_id}/runs?api-version=2025-05-01"
          req = urllib.request.Request(url, data=json.dumps({"assistant_id": agent_id}).encode(), headers=headers)
          try:
              run = json.loads(urllib.request.urlopen(req).read())
          except urllib.error.HTTPError as e:
              print(f"Run agent failed: {e.code} {e.read().decode()}")
              raise

          run_id = run["id"]
          print(f"Run ID: {run_id}")

          # Poll until complete
          for i in range(30):
              time.sleep(3)
              url = f"{endpoint}/threads/{thread_id}/runs/{run_id}?api-version=2025-05-01"
              req = urllib.request.Request(url, headers=headers)
              run = json.loads(urllib.request.urlopen(req).read())
              print(f"Poll {i}: {run['status']}")
              if run["status"] in ["completed", "failed", "cancelled"]:
                  break

          # Get messages
          url = f"{endpoint}/threads/{thread_id}/messages?api-version=2025-05-01"
          req = urllib.request.Request(url, headers=headers)
          msgs = json.loads(urllib.request.urlopen(req).read())
          review = msgs["data"][0]["content"][0]["text"]["value"]

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"review<<EOF\n{review}\nEOF\n")
          EOF

      - name: Post PR comment
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🤖 AI Code Review\n\n${{ steps.review.outputs.review }}`
            })