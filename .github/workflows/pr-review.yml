name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    # Kjører kun på draft-PRs under testing — fjern når klar for alle PRs
    if: github.event.pull_request.draft == true
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get diff
        id: diff
        run: |
          DIFF=$(git diff origin/${{ github.base_ref }}...HEAD | head -c 20000)
          echo "diff<<EOF" >> $GITHUB_OUTPUT
          echo "$DIFF" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Call Foundry Agent
        id: review
        env:
          FOUNDRY_ENDPOINT: ${{ secrets.FOUNDRY_ENDPOINT }}
          FOUNDRY_TOKEN: ${{ secrets.FOUNDRY_TOKEN }}
          FOUNDRY_AGENT_ID: ${{ secrets.FOUNDRY_AGENT_ID }}
          PR_DIFF: ${{ steps.diff.outputs.diff }}
        run: |
          python3 - <<'EOF'
          import os, json, urllib.request, urllib.error, time

          endpoint = os.environ["FOUNDRY_ENDPOINT"].rstrip("/")
          token = os.environ["FOUNDRY_TOKEN"]
          agent_id = os.environ["FOUNDRY_AGENT_ID"]
          diff = os.environ["PR_DIFF"]

          headers = {
              "Content-Type": "application/json",
              "Authorization": f"Bearer {token}"
          }

          system_context = """Du er en erfaren .NET-utvikler som reviewer pull requests for Twolate,
          et internt automatiseringsverktøy for tidsregistrering og fakturering bygget med:
          - Blazor Server (.NET 10)
          - React (frontend-komponenter)
          - Azure Cosmos Table Storage
          - Azure Storage Queues
          - Azure Communication Services (e-post)
          - Azure App Configuration
          - Application Insights
          - Multi-agent pipelines (Azure AI Foundry)

          Fokuser på:
          1. Korrekthet og logiske feil
          2. Azure SDK-bruk og async/await-mønstre
          3. Feil håndtering av Cosmos- eller Queue-operasjoner
          4. Sikkerhet (eksponerte secrets, manglende autorisasjonssjekker)
          5. Ytelse (unødvendige await-er, N+1-mønstre mot Cosmos)

          Vær kortfattet. Bruk bullet points. Skill mellom kritiske funn og nice-to-have."""

          print(f"Endpoint: {endpoint}")
          print(f"Agent ID: {agent_id}")

          # Create thread
          url = f"{endpoint}/threads?api-version=2025-05-01"
          print(f"Creating thread at: {url}")
          req = urllib.request.Request(url, data=json.dumps({}).encode(), headers=headers)
          try:
              thread = json.loads(urllib.request.urlopen(req).read())
          except urllib.error.HTTPError as e:
              print(f"Create thread failed: {e.code} {e.read().decode()}")
              raise
          thread_id = thread["id"]
          print(f"Thread ID: {thread_id}")

          # Add message
          url = f"{endpoint}/threads/{thread_id}/messages?api-version=2025-05-01"
          message_content = f"{system_context}\n\nReview denne PR-diffen:\n\n{diff}"
          req = urllib.request.Request(
              url,
              data=json.dumps({"role": "user", "content": message_content}).encode(),
              headers=headers
          )
          try:
              urllib.request.urlopen(req)
          except urllib.error.HTTPError as e:
              print(f"Add message failed: {e.code} {e.read().decode()}")
              raise

          # Run agent
          url = f"{endpoint}/threads/{thread_id}/runs?api-version=2025-05-01"
          req = urllib.request.Request(
              url,
              data=json.dumps({"assistant_id": agent_id}).encode(),
              headers=headers
          )
          try:
              run = json.loads(urllib.request.urlopen(req).read())
          except urllib.error.HTTPError as e:
              print(f"Run agent failed: {e.code} {e.read().decode()}")
              raise
          run_id = run["id"]
          print(f"Run ID: {run_id}")

          # Poll until complete
          for i in range(30):
              time.sleep(3)
              url = f"{endpoint}/threads/{thread_id}/runs/{run_id}?api-version=2025-05-01"
              req = urllib.request.Request(url, headers=headers)
              run = json.loads(urllib.request.urlopen(req).read())
              print(f"Poll {i}: {run['status']}")
              if run["status"] in ["completed", "failed", "cancelled"]:
                  break

          if run["status"] != "completed":
              raise Exception(f"Run ended with status: {run['status']}")

          # Get messages
          url = f"{endpoint}/threads/{thread_id}/messages?api-version=2025-05-01"
          req = urllib.request.Request(url, headers=headers)
          msgs = json.loads(urllib.request.urlopen(req).read())
          review = msgs["data"][0]["content"][0]["text"]["value"]

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"review<<EOF\n{review}\nEOF\n")
          EOF

      - name: Post PR comment
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🤖 AI Code Review\n\n${{ steps.review.outputs.review }}`
            })