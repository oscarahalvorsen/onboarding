name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get diff
        id: diff
        run: |
          DIFF=$(git diff origin/${{ github.base_ref }}...HEAD)
          echo "diff<<EOF" >> $GITHUB_OUTPUT
          echo "$DIFF" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Call Foundry Agent
        id: review
        run: |
          RESPONSE=$(curl -s -X POST "${{ secrets.FOUNDRY_ENDPOINT }}/agents/${{ secrets.FOUNDRY_AGENT_ID }}/threads/runs" \
            -H "Content-Type: application/json" \
            -H "api-key: ${{ secrets.FOUNDRY_API_KEY }}" \
            -d '{
              "messages": [{
                "role": "user",
                "content": "Review this PR diff:\n\n${{ steps.diff.outputs.diff }}"
              }]
            }')
          REVIEW=$(echo $RESPONSE | jq -r '.content[0].text')
          echo "review=$REVIEW" >> $GITHUB_OUTPUT

      - name: Post PR comment
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🤖 AI Code Review\n\n${{ steps.review.outputs.review }}`
            })